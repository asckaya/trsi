[project]
name = "trainer-rsi"
version = "0.1.0"
description = "Full-pipeline optimizer for training programs: capture, attribute, rewrite, verify — on remote GPUs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dulwich>=1.2.19",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# The only optional runtime dependency, because it is the only piece that drives
# another program. `torch` is deliberately absent: capture runs inside the model's
# own environment and borrows the torch that is already there.
agent = ["openai-codex>=0.163"]

[project.scripts]
trsi = "trainer_rsi.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.0.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
# Engine groups exist to check this project against the real thing, never to run it.
# The tool imports none of them: capture and kernels emit source, the agent runtime
# drives a separate program, and all three live in the environment of the model
# being optimised. `uv sync --all-groups` for a complete development environment.
capture = ["torch>=2.14.1"]
kernel = ["tilelang>=0.1.15"]
agent = ["openai-codex>=0.163"]

[tool.uv]
# torch appears only in the `capture` group, for the tests that export a graph and
# read a profiler trace on a machine with nothing to accelerate. The CPU wheel
# keeps that install small. Nothing the package ships depends on it: capture
# borrows the torch installed beside the model.
[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D2", "D3", "D4", "UP", "B", "SIM", "RUF", "ANN", "RET", "ARG", "PL"]
ignore = [
    # Long single-line report strings stay readable; wrapping them is worse.
    "E501",
    "D203",
    "D213",
    # Docstrings here are dense by design; D205 wants a blank line after summary.
    "D205",
    "PLR0913",
    "PLR2004",
    # A cost table is a dispatch over kinds; branch and return counts follow from it.
    "PLR0911",
    "PLR0912",
    # These are pydantic fields, which carry their own default-copying;
    # RUF012 wants a ClassVar, which would stop them being fields.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# The agent runtime is imported inside the one function that drives a turn, so the
# package imports without it installed.
"src/trainer_rsi/harness/runner.py" = ["PLC0415"]
# Tests assert on literals; that is the point of a test.
"tests/**" = ["ANN", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.14"
