[spec]
schema = "trainer_rsi.hardware/v1"
kind = "device"
id = "nvidia.rtx_pro_6000_blackwell"
label = "NVIDIA RTX PRO 6000 Blackwell Workstation Edition, 96 GB GDDR7"

[compatibility]
architecture = "nvidia.sm120"

[facts.compute.sm_count]
value = 188
unit = "count"
origin = "derived"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "derived: the datasheet states 24064 CUDA cores, and the Blackwell SM issues 128 FP32 lanes over 128 cores, so 24064 / 128 = 188 SMs."

[facts.throughput.f32]
value = 125000000000000
unit = "flop/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "125 TFLOPS single precision at the boost clock, the datasheet row with no sparsity footnote."

[facts.throughput.tf32]
status = "unavailable"
unit = "flop/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "the datasheet publishes no TF32 row for this product."

[facts.throughput.f16]
value = 500000000000000
unit = "flop/s"
origin = "derived"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "inferred, not published: the datasheet states 4000 AI TOPS as FP4 with sparsity, so dense FP4 is 2000 TOPS and the Blackwell fifth-generation tensor core issues FP4, FP8 and FP16 at 4:2:1, giving 500 TFLOPS. The same ratio is published explicitly for B200 (9 / 4.5 / 2.25 PFLOPS dense), which is the cross-check for the ratio and not for this product's clock."

[facts.throughput.bf16]
value = 500000000000000
unit = "flop/s"
origin = "derived"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "inferred, not published: 4000 AI TOPS is FP4 with sparsity, so dense FP4 is 2000 TOPS and BF16 follows at one quarter of it, 500 TFLOPS, by the same 4:2:1 ratio B200 publishes explicitly."

[facts.throughput.fp8e4m3]
value = 1000000000000000
unit = "flop/s"
origin = "derived"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "inferred, not published: half the dense FP4 rate of 2000 TOPS, by the 4:2:1 ratio B200 publishes explicitly."

[facts.throughput.fp8e5m2]
value = 1000000000000000
unit = "flop/s"
origin = "derived"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "same tensor core path as E4M3, so the same rate."

[facts.throughput.f4e2m1]
value = 2000000000000000
unit = "flop/s"
origin = "derived"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "dense; the datasheet states 4000 AI TOPS for FP4 with the footnote that it counts sparsity, so dense FP4 is half."

[facts.memory.hbm.capacity]
value = 96000000000
unit = "byte"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "96 GB GDDR7 with ECC, one pool shared by the whole device; the same capacity is stated for the Server and Max-Q editions."

[facts.memory.hbm.bandwidth]
value = 1792000000000
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "1792 GB/s on a 512-bit GDDR7 interface, the Workstation Edition figure; the Server Edition datasheet states 1597 GB/s and is a different product."

[facts.memory.hbm.latency]
status = "unavailable"
unit = "s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "no vendor figure; latency does not enter a bandwidth-bound bound."

[facts.memory.l2.capacity]
status = "unavailable"
unit = "byte"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "the datasheet publishes no L2 capacity."

[facts.memory.l2.bandwidth]
status = "unavailable"
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "NVIDIA publishes no static L2 bandwidth."

[facts.interconnect.nvlink.bandwidth]
status = "unavailable"
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "this product has no NVLink connector; the system interface is PCIe 5.0 x16."

[facts.interconnect.nvlink.domain]
value = 1
unit = "count"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "no NVLink, so a group of these cards is joined by PCIe and any collective across them crosses it."

[facts.interconnect.pcie.bandwidth]
value = 128000000000
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/workstation-datasheet-blackwell-rtx-pro6000-x-nvidia-us-3519208-web.pdf"
conditions = "PCIe 5.0 x16, 128 GB/s counting both directions."
