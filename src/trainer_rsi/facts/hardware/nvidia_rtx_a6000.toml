[facts.memory.l2.bandwidth]
status = "unavailable"
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-a6000-datasheet.pdf"
