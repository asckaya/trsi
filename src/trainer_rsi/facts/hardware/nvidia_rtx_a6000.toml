[facts.interconnect.nvlink.bandwidth]
status = "unavailable"
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-a6000-datasheet.pdf"
conditions = "the card supports a 2-way low-profile NVLink bridge, and the datasheet states no rate for it, so nothing is recorded here rather than a figure inferred from another product."

[facts.interconnect.nvlink.domain]
value = 2
unit = "count"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-a6000-datasheet.pdf"
conditions = "a 2-way bridge links at most two cards; there is no NVSwitch fabric on this product."

[facts.interconnect.pcie.bandwidth]
value = 64000000000
unit = "byte/s"
origin = "vendor"
source = "https://www.nvidia.com/content/dam/en-zz/Solutions/products/workstations/nvidia-rtx-a6000-datasheet.pdf"
